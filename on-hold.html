<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <meta name="robots" content="noindex" />
  <title>Fibre Network Planner – On hold</title>

  <style>
    :root {
      --fibre-primary: #0e6ba8;
      --fibre-primary-dark: #0a4d7a;
      --fibre-accent: #f0973d;
      --fibre-surface: #ffffff;
      --fibre-surface-muted: #f4f8fb;
      --fibre-border: #dee7ec;
      --fibre-text: #16333f;
      --fibre-text-muted: #61808c;
      --fibre-radius: 14px;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      box-sizing: border-box;
      background: var(--fibre-surface-muted);
      color: var(--fibre-text);
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    .hold-card {
      max-width: 460px;
      width: 100%;
      background: var(--fibre-surface);
      border: 1px solid var(--fibre-border);
      border-top: 4px solid var(--fibre-accent);
      border-radius: var(--fibre-radius);
      padding: 32px 28px;
      box-sizing: border-box;
      text-align: center;
      box-shadow: 0 8px 24px rgba(14, 107, 168, 0.08);
    }

    .hold-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      background: var(--fibre-surface-muted);
      border: 1px solid var(--fibre-border);
      color: var(--fibre-primary-dark);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    h1 {
      margin: 16px 0 8px;
      font-size: 22px;
      color: var(--fibre-primary-dark);
    }

    p {
      margin: 0 0 12px;
      font-size: 15px;
      line-height: 1.55;
      color: var(--fibre-text-muted);
    }

    p:last-child {
      margin-bottom: 0;
    }

    strong {
      color: var(--fibre-text);
    }
  </style>
</head>

<body>
  <main class="hold-card">
    <span class="hold-badge">On hold</span>
    <h1>Fibre Network Planner is currently on hold</h1>
    <p>This application has been temporarily paused and is not available right now.</p>
    <p>If you need access, please <strong>contact the application administrators</strong>.</p>
  </main>
</body>

</html>
